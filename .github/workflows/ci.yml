name: CI/CD Pipeline - Enterprise Document Assistant

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Unit, Integration & Evaluation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Pytest Suite with Coverage
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing

      - name: Run ACL Security & Penetration Check
        env:
          PYTHONPATH: .
        run: |
          pytest tests/unit/test_acl_roles.py -v

      - name: Run Evaluation Harness Smoke Test
        env:
          PYTHONPATH: .
        run: |
          python -m src.evaluation.harness --dataset id_enterprise --smoke-test
